name: audit

# Apart from the gate: a new advisory turns this job red without blocking
# unrelated work. It needs only the network (the advisory database).
on:
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches:
      - master
    paths:
      - Cargo.lock
      - deny.toml
      # A change to this workflow is itself run once.
      - .github/workflows/audit.yml
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
      # A change to this workflow is itself run once.
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Audit dependencies
        run: nix-shell --run 'just audit'

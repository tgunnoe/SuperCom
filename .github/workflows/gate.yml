name: gate

on:
  pull_request:
  push:
    branches:
      - master
      - campaign/**

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free runner disk
        # The cold debug build of the workspace plus the Nix store exceeds the
        # runner's root volume; drop the preinstalled toolchains the gate never uses.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run gate
        # Line tables only: the same checks and tests, with several times less
        # debug information in the 30-odd test binaries.
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_INCREMENTAL: "0"
        run: nix-shell --run 'just gate'

      - name: Report disk use
        if: always()
        run: df -h / | tail -1

  # The gate's runner has no graphics adapter, so the gate's GPU tests skip there.
  # This job runs the ones that need no installed game on Mesa's software Vulkan
  # driver (llvmpipe), with an adapter required: no adapter, a skip line, or no test
  # at all fails it.
  gpu:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Free runner disk
        # The cold debug build of the workspace plus the Nix store exceeds the
        # runner's root volume; drop the preinstalled toolchains the gate never uses.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h / | tail -1

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run the GPU tests
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_INCREMENTAL: "0"
          SUPERCOM_REQUIRE_GPU: "1"
          # Read by shell.nix when nix-shell starts: offers the software driver.
          SUPERCOM_SOFTWARE_VULKAN: "1"
        run: nix-shell --run 'just ci-gpu'

      - name: Report disk use
        if: always()
        run: df -h / | tail -1

  # The determinism evidence, the simulation, and the texture decoder on an ARM
  # executor, where the cross-architecture float claims are decided.
  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Run the ARM tests
        env:
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
          CARGO_INCREMENTAL: "0"
        run: nix-shell --run 'just ci-arm'

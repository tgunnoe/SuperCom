name: gate

on:
  pull_request:
  push:
    branches:
      - master
      - campaign/**

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      - name: Run gate
        run: nix-shell --run 'just gate'

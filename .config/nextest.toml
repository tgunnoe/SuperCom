# Run every test even after one fails, so a red suite reports all of its
# failures in one pass instead of cancelling the rest at the first.
[profile.default]
fail-fast = false

# Game-dependent tests skip by printing `SKIP: <reason>` and passing, because
# nextest has no runtime skip. Show their output on success too, so a skip
# is loud rather than silently green.
[[profile.default.overrides]]
filter         = 'test(/conformance_/)'
success-output = "immediate"

# The plugin tests end on fuel, so a host that stopped metering it would hang
# them instead of failing; bound each one and kill it rather than wait. The
# slowest cold run, fixture build included, is well under a tenth of the kill
# time.
[[profile.default.overrides]]
filter       = 'package(supercom-plugin)'
slow-timeout = { period = "60s", terminate-after = 2 }

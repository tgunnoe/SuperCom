[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.8
# Workspace crates are unpublished and the project license is not chosen yet
# (AGENTS.md U4); dependencies are still audited.
private                = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[sources]
unknown-git      = "deny"
unknown-registry = "deny"

[graph]
all-features = true

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CC0-1.0",
  "ISC",
  "LGPL-3.0",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
]
confidence-threshold = 0.8
# Workspace crates are GPL-3.0-or-later and unpublished; the allowlist below
# governs dependencies only (AGENTS.md I8). LGPL-3.0 and MPL-2.0 were admitted
# by the head's ruling of 2026-10-08 (ADR-0005, amendment 1).
private                = { ignore = true }
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards         = "deny"

[sources]
unknown-git      = "deny"
unknown-registry = "deny"

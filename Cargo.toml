[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "GPL-3.0-or-later"
repository   = "https://github.com/tgunnoe/SuperCom"
rust-version = "1.85"
version      = "0.0.1"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
expect_used = "warn"
panic       = "warn"
pedantic    = { level = "warn", priority = -1 }
unwrap_used = "warn"

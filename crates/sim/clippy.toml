# This file replaces the workspace root's clippy.toml for this crate, so it
# repeats the root's allowances (AGENTS.md I6) before adding the sim's bans.
allow-expect-in-tests = true
allow-unwrap-in-tests = true

disallowed-types = [
  { path = "std::collections::HashMap", reason = "iteration order is unspecified (DET-001); use BTreeMap" },
  { path = "std::collections::HashSet", reason = "iteration order is unspecified (DET-001); use BTreeSet" },
  { path = "std::time::Instant", reason = "the sim never reads the clock (DET-004, SIM-036)" },
  { path = "std::time::SystemTime", reason = "the sim never reads the clock (DET-004, SIM-036)" },
]

